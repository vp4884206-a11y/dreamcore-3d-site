<script>
(function(){
var canvas=document.getElementById('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(45,1,.1,100);
var baseZ=9,zoom=baseZ;
var group=new THREE.Group();scene.add(group);

// Crystal blob
var uniforms={uTime:{value:0},uPulse:{value:0},uMouse:{value:new THREE.Vector2()},uDeep:{value:new THREE.Color()},uMid:{value:new THREE.Color()},uHot:{value:new THREE.Color()}};
var tD=new THREE.Color(),tM=new THREE.Color(),tH=new THREE.Color();
function setPalette(hex){var c=new THREE.Color(hex);tM.copy(c);tD.copy(c).multiplyScalar(.3);tH.copy(c).lerp(new THREE.Color(0xffffff),.55);}
setPalette(0xF29E2E);uniforms.uDeep.value.copy(tD);uniforms.uMid.value.copy(tM);uniforms.uHot.value.copy(tH);
var blobMat=new THREE.ShaderMaterial({
  uniforms:uniforms,
  vertexShader:`
    uniform float uTime;uniform float uPulse;uniform vec2 uMouse;
    varying vec3 vN;varying vec3 vP;varying float vD;
    void main(){
      vec3 p=position;
      float t=uTime*.7;
      float d=sin(p.x*2.1+t)*sin(p.y*2.4+t*1.2)*sin(p.z*2.2+t*.9);
      d+=.5*sin(p.x*5.0-t*1.5)*sin(p.y*4.6+t)*sin(p.z*5.2);
      d+=uPulse*sin(length(p)*9.0-uTime*6.0);
      d+=.15*dot(normalize(p),vec3(uMouse,0.0));
      p+=normal*d*.28;
      vD=d;
      vN=normalize(normalMatrix*normal);
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      vP=-mv.xyz;
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform float uTime;uniform vec3 uDeep;uniform vec3 uMid;uniform vec3 uHot;
    varying vec3 vN;varying vec3 vP;varying float vD;
    void main(){
      vec3 n=normalize(vN);vec3 v=normalize(vP);
      float f=pow(1.0-max(dot(n,v),0.0),2.2);
      vec3 deep=uDeep;vec3 mid=uMid;vec3 hot=uHot;
      vec3 c=mix(deep,mid,.5+.5*vD+.3*n.y);
      c=mix(c,hot,f*.85);
      vec3 irid=.5+.5*cos(6.2831*(f*1.2+vec3(0.0,.33,.67)+uTime*.05));
      c+=irid*f*.25;
      float spec=pow(max(dot(reflect(-v,n),normalize(vec3(.4,.8,.6))),0.0),24.0);
      c+=spec*.9;
      gl_FragColor=vec4(c,1.0);
    }`
});
var blob=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,48),blobMat);
group.add(blob);

// Lights for spheres
scene.add(new THREE.AmbientLight(0xa07a48,.7));
var l1=new THREE.PointLight(0xff9bf0,2.2,40);l1.position.set(5,4,6);scene.add(l1);
var l2=new THREE.PointLight(0xdce0f2,1.6,40);l2.position.set(-6,-3,4);scene.add(l2);

// Orbits
var orbits=[];
var cfg=[
  {a:3.3,b:2.1,tilt:.55,rot:.2,n:14,size:.1,speed:.28},
  {a:4.0,b:2.6,tilt:-.35,rot:.9,n:18,size:.07,speed:-.2},
  {a:2.8,b:1.7,tilt:.95,rot:-.6,n:10,size:.13,speed:.36}
];
var sphereGeo=new THREE.SphereGeometry(1,24,24);
cfg.forEach(function(o){
  var pivot=new THREE.Group();
  pivot.rotation.set(o.tilt,o.rot,o.tilt*.4);
  var pts=[];
  for(var i=0;i<=128;i++){var t=i/128*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(t)*o.a,0,Math.sin(t)*o.b));}
  var lm=new THREE.LineBasicMaterial({color:0xcdb6ff,transparent:true,opacity:.32});pivot.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lm));
  var mat=new THREE.MeshPhongMaterial({color:0xdce0f2,specular:0xffffff,shininess:140,emissive:0x2a1060});
  var spheres=[];
  for(var j=0;j<o.n;j++){
    var m=new THREE.Mesh(sphereGeo,mat);
    var s=o.size*(.6+((j*37)%10)/10*.9);
    m.scale.setScalar(s);
    m.userData.phase=j/o.n*Math.PI*2;
    pivot.add(m);spheres.push(m);
  }
  group.add(pivot);
  orbits.push({o:o,spheres:spheres,pivot:pivot,mat:mat,lm:lm});
});

// Star dust
var sp=[];for(var k=0;k<700;k++){var r=12+Math.random()*18,th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1);sp.push(r*Math.sin(ph)*Math.cos(th),r*Math.sin(ph)*Math.sin(th),r*Math.cos(ph));}
var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
var stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xdce0f2,size:.05,transparent:true,opacity:.7}));
scene.add(stars);

// Interaction
var zoffs=[0,-1,1.5,-.5],cur=0;
var rotX=.15,rotY=0,velX=0,velY=0,dragging=false,lx=0,ly=0,mx=0,my=0,pulse=0,moved=0;
canvas.addEventListener('pointerdown',function(e){dragging=true;moved=0;lx=e.clientX;ly=e.clientY;canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',function(e){
  mx=(e.clientX/innerWidth)*2-1;my=-((e.clientY/innerHeight)*2-1);
  if(!dragging)return;
  var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  velY=dx*.005;velX=dy*.005;rotY+=velY;rotX+=velX;
});
function up(){dragging=false;canvas.classList.remove('drag');}
canvas.addEventListener('pointerup',function(){up();if(moved<5)pulse=1;});
canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.min(14,Math.max(5.5,zoom+e.deltaY*.005));},{passive:false});



// ---- Steps & info content
var STEPS=[
 {t:"Explore orbit",s:"Follow the paths that hold a system together.",hex:0xF29E2E,ac:"#F29E2E",on:"#0B0907",bg:"#0B0907",b:"Space info",it:"Space info",tx:"Orbits, planets and the scale of our neighbourhood."},
 {t:"Dream in colour",s:"Every star burns a different shade. Pick one and watch the crystal change.",hex:0xA8F0C6,ac:"#A8F0C6",on:"#0B0907",bg:"#0B0907",b:"Star types",it:"Star types",tx:"Seven spectral classes, from hot blue to cool red."},
 {t:"Beyond dimensions",s:"Explore a space where reality meets imagination.",hex:0xA07A48,ac:"#A07A48",on:"#0B0907",bg:"#0B0907",b:"Cosmic scale",it:"Cosmic scale",tx:"Dimensions, galaxies and the edge of what we can see."},
 {t:"Find your universe",s:"Every corner holds something waiting to be discovered.",hex:0xE7BF90,ac:"#E7BF90",on:"#0B0907",bg:"#0B0907",b:"Zodiac & astrology",it:"Zodiac & astrology",tx:"The twelve signs, with their dates, elements and ruling planets."}
];
var STARS=[

var clock=new THREE.Clock(),T=0;
function frame(){
  var dt=Math.min(clock.getDelta(),.05);
  T+=reduce?dt*.2:dt;
  if(!dragging){velX*=.95;velY*=.95;rotY+=velY+dt*.12*(reduce?0:1);rotX+=velX;}
  rotX=Math.max(-1.2,Math.min(1.2,rotX));
  group.rotation.y+=(rotY-group.rotation.y)*.1;
  group.rotation.x+=(rotX-group.rotation.x)*.1;
  pulse*=.94;
  uniforms.uTime.value=T;uniforms.uPulse.value=pulse*.35;
  uniforms.uMouse.value.set(mx,my);
  uniforms.uDeep.value.lerp(tD,.06);uniforms.uMid.value.lerp(tM,.06);uniforms.uHot.value.lerp(tH,.06);
  blob.rotation.y=T*.15;
  orbits.forEach(function(ob){
    ob.spheres.forEach(function(m){
      var t=m.userData.phase+T*ob.o.speed;
      m.position.set(Math.cos(t)*ob.o.a,0,Math.sin(t)*ob.o.b);
    });
  });
  stars.rotation.y=T*.01;
  camera.position.x+=(mx*.8-camera.position.x)*.04;
  camera.position.y+=(my*.5-camera.position.y)*.04;
  var z=zoom+zoffs[cur];
  camera.position.z+=(z-camera.position.z)*.08;
  camera.lookAt(0,0,0);
  if(!onPage)renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
